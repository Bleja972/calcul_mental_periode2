<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calcul mental CE1 — Période 2</title>
<style>
:root{--navy:#16324f;--blue:#1677c8;--green:#1e8b57;--red:#c93f3f;--bg:#f5f8fb;--line:#d8e1ea}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#18232e}
header{background:#fff;border-bottom:1px solid var(--line);padding:18px 16px;text-align:center}
h1{margin:0;font-size:clamp(1.55rem,4vw,2.3rem);color:var(--navy)} header p{margin:7px 0 0;font-weight:700;color:#536575}
.wrap{width:min(1100px,96vw);margin:18px auto 36px} .panel{background:white;border:1px solid var(--line);border-radius:18px;padding:18px}
.menuTop{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px} .badge{font-weight:900;color:var(--navy);background:#edf4fb;padding:9px 12px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px} .card{border:2px solid var(--line);background:#fff;border-radius:15px;padding:14px;text-align:left;cursor:pointer;min-height:94px}
.card:hover{border-color:#9ec8ea} .card strong{display:block;color:var(--navy);font-size:1.05rem;margin-bottom:5px} .card span{font-size:.94rem;color:#526373} .card small{display:block;margin-top:7px;font-weight:800;color:#72808c}
.hidden{display:none!important} .gameHead{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;margin-bottom:14px} .gameHead h2{margin:0;font-size:clamp(1.2rem,3.4vw,1.7rem);color:var(--navy)}
.skill{font-weight:800;color:#526373;margin-top:4px} .timer{font-size:clamp(1.4rem,5vw,2rem);font-weight:900;padding:9px 14px;border-radius:12px;background:#eef5fb;color:var(--navy);min-width:108px;text-align:center} .timer.danger{background:#fdeaea;color:var(--red)}
.score{font-weight:900;padding:9px 12px;background:#f0f7f2;border-radius:12px;color:var(--green);white-space:nowrap} .progress{height:10px;background:#e6edf3;border-radius:999px;overflow:hidden;margin:10px 0 18px} .progress>div{height:100%;width:0;background:var(--green);transition:width .2s}
.calcGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px} .calc{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fbfdff;display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.expr{font-size:clamp(1.2rem,3vw,1.65rem);font-weight:900;color:#112b46;white-space:nowrap} .inlineAns{display:inline-block;width:78px;height:48px;border:2px solid #9fb1c3;border-radius:10px;background:#fff;font-size:1.35rem;font-weight:900;text-align:center;color:#112b46;vertical-align:middle;margin:0 5px}.inlineAns:focus{outline:3px solid #b9ddf7;border-color:var(--blue)}.ans{width:88px;max-width:34%;height:48px;border:2px solid #9fb1c3;border-radius:10px;background:white;font-size:1.35rem;font-weight:900;text-align:center;color:#112b46}
.ans:focus{outline:3px solid #b9ddf7;border-color:var(--blue)} .calc.good{background:#effaf3;border-color:#8bc9a5} .calc.bad{background:#fff1f1;border-color:#e2a1a1} .expected{font-size:.82rem;color:var(--red);font-weight:800;display:none} .calc.bad .expected{display:block}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px} button{font:inherit} .btn{border:0;border-radius:12px;padding:12px 18px;font-weight:900;cursor:pointer;min-height:46px} .primary{background:var(--blue);color:white} .secondary{background:#e9eef3;color:#22313d} .finish{background:var(--green);color:white}
.result{text-align:center;padding:22px 10px} .big{font-size:clamp(2rem,8vw,4rem);font-weight:900;color:var(--navy)} .pct{font-size:clamp(1.5rem,5vw,2.2rem);font-weight:900;color:var(--green);margin:8px 0} .note{font-weight:800;color:#526373}
@media(max-width:820px){.calcGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.gameHead{grid-template-columns:1fr auto}.score{grid-column:1/-1;justify-self:start}}
@media(max-width:520px){.grid,.calcGrid{grid-template-columns:1fr}.wrap{width:min(96vw,720px);margin-top:10px}.panel{padding:12px}.gameHead{grid-template-columns:1fr}.timer,.score{justify-self:start}.calc{padding:12px}.ans{width:96px}}
</style></head><body>
<header><h1>Les Petits Défis CE1 — Calcul mental • Période 2</h1><p>3 minutes par série • chaque exercice du livret apparaît une seule fois</p></header>
<div class="wrap">
<section id="menu" class="panel"><div class="menuTop"><div><strong style="font-size:1.25rem;color:var(--navy)">Choisis une série</strong><div style="margin-top:4px;color:#647482">14 séries uniques de la période 2</div></div><div class="badge">⏱️ 3:00</div></div><div id="menuGrid" class="grid"></div></section>
<section id="game" class="panel hidden"><div class="gameHead"><div><h2 id="gameTitle"></h2><div id="gameSkill" class="skill"></div></div><div><div id="timer" class="timer">3:00</div><div style="font-size:.78rem;color:#647482;text-align:center;margin-top:4px">Le chrono démarre dès que la première réponse est terminée.</div></div><div id="score" class="score">Réponses : 0</div></div><div class="progress"><div id="progressBar"></div></div><div id="calcGrid" class="calcGrid"></div><div class="actions"><button id="finishBtn" class="btn finish">✓ Terminer et corriger</button><button id="menuBtn" class="btn secondary">← Retour au menu</button></div></section>
<section id="result" class="panel hidden result"><div id="resultTitle" style="font-size:1.25rem;font-weight:900;color:var(--navy)"></div><div id="resultScore" class="big"></div><div id="resultPct" class="pct"></div><div id="resultNote" class="note"></div><div class="actions"><button id="retryBtn" class="btn primary">↻ Rejouer cette série</button><button id="backBtn" class="btn secondary">☰ Choisir une autre série</button></div></section>
</div>
<script>
const SETS=[{"id": "8-2", "title": "Séance 8 • Série 2", "skill": "Compléter à la dizaine supérieure", "time": 180, "items": [["33 + □ = 40", 7], ["67 + □ = 70", 3], ["□ + 26 = 30", 4], ["□ + 75 = 80", 5], ["52 + □ = 60", 8], ["91 + □ = 100", 9], ["148 + □ = 150", 2], ["384 + □ = 390", 6], ["739 + □ = 740", 1], ["455 + □ = 460", 5], ["□ + 623 = 630", 7], ["□ + 803 = 810", 7]]}, {"id": "8-3", "title": "Séance 8 • Série 3", "skill": "Compléter à la dizaine supérieure", "time": 180, "items": [["41 + □ = 50", 9], ["92 + □ = 100", 8], ["□ + 38 = 40", 2], ["□ + 57 = 60", 3], ["72 + □ = 80", 8], ["23 + □ = 30", 7], ["894 + □ = 900", 6], ["777 + □ = 780", 3], ["639 + □ = 640", 1], ["405 + □ = 410", 5], ["□ + 841 = 850", 9], ["□ + 286 = 290", 4]]}, {"id": "9-2", "title": "Séance 9 • Série 2", "skill": "Ajouter un nombre inférieur à 9", "time": 180, "items": [["33 + 8 =", 41], ["67 + 4 =", 71], ["6 + 89 =", 95], ["7 + 78 =", 85], ["157 + 7 =", 164], ["352 + □ = 360", 8], ["438 + 5 =", 443], ["798 + □ = 800", 2], ["514 + 8 =", 522], ["945 + 6 =", 951], ["7 + 289 =", 296], ["3 + 678 =", 681]]}, {"id": "9-3", "title": "Séance 9 • Série 3", "skill": "Ajouter un nombre inférieur à 9", "time": 180, "items": [["45 + 7 =", 52], ["83 + 8 =", 91], ["7 + 69 =", 76], ["4 + 98 =", 102], ["235 + 8 =", 243], ["347 + □ = 350", 3], ["684 + 7 =", 691], ["896 + □ = 901", 5], ["528 + 3 =", 531], ["876 + 5 =", 881], ["6 + 328 =", 334], ["2 + 849 =", 851]]}, {"id": "10-2", "title": "Séance 10 • Série 2", "skill": "Ajouter ou soustraire des dizaines", "time": 180, "items": [["33 + 40 =", 73], ["67 − 20 =", 47], ["16 + 80 =", 96], ["79 − 30 =", 49], ["157 + 10 =", 167], ["567 − 40 =", 527], ["438 + 50 =", 488], ["670 − 60 =", 610], ["54 + 70 =", 124], ["352 − 10 =", 342], ["389 + 30 =", 419], ["873 − 50 =", 823]]}, {"id": "10-3", "title": "Séance 10 • Série 3", "skill": "Ajouter ou soustraire des dizaines", "time": 180, "items": [["83 + 20 =", 103], ["75 − 40 =", 35], ["73 + 30 =", 103], ["99 − 50 =", 49], ["324 + 30 =", 354], ["628 − 10 =", 618], ["369 + 40 =", 409], ["751 − 30 =", 721], ["92 + 90 =", 182], ["471 − 60 =", 411], ["873 + 20 =", 893], ["251 − 40 =", 211]]}, {"id": "11-2", "title": "Séance 11 • Série 2", "skill": "Ajouter ou soustraire des centaines", "time": 180, "items": [["433 + 400 =", 833], ["367 − 200 =", 167], ["600 + 300 =", 900], ["790 − 500 =", 290], ["100 + 425 =", 525], ["251 + 600 =", 851], ["638 + 200 =", 838], ["700 + 160 =", 860], ["400 + 600 =", 1000], ["753 − 200 =", 553], ["389 + 300 =", 689], ["1000 − 500 =", 500]]}, {"id": "11-3", "title": "Séance 11 • Série 3", "skill": "Ajouter ou soustraire des centaines", "time": 180, "items": [["851 + 200 =", 1051], ["432 − 300 =", 132], ["600 + 200 =", 800], ["780 − 400 =", 380], ["500 + 152 =", 652], ["269 + 700 =", 969], ["571 + 300 =", 871], ["300 + 443 =", 743], ["400 + 300 =", 700], ["937 − 800 =", 137], ["486 + 400 =", 886], ["640 − 100 =", 540]]}, {"id": "12-2", "title": "Séance 12 • Série 2", "skill": "Ajouter 9, 19 ou 29", "time": 180, "items": [["23 + 9 =", 32], ["67 + 9 =", 76], ["42 + 19 =", 61], ["9 + 74 =", 83], ["9 + 86 =", 95], ["157 + 9 =", 166], ["682 + 9 =", 691], ["720 + 19 =", 739], ["9 + 374 =", 383], ["9 + 806 =", 815], ["37 + 19 =", 56], ["56 + 29 =", 85], ["80 + 19 =", 99], ["29 + 73 =", 102], ["19 + 563 =", 582]]}, {"id": "12-3", "title": "Séance 12 • Série 3", "skill": "Ajouter 9, 19 ou 29", "time": 180, "items": [["34 + 9 =", 43], ["43 + 9 =", 52], ["75 + 19 =", 94], ["9 + 87 =", 96], ["9 + 59 =", 68], ["163 + 9 =", 172], ["826 + 9 =", 835], ["354 + 19 =", 373], ["9 + 520 =", 529], ["9 + 747 =", 756], ["42 + 29 =", 71], ["60 + 29 =", 89], ["58 + 19 =", 77], ["29 + 66 =", 95], ["19 + 872 =", 891]]}, {"id": "13-2", "title": "Séance 13 • Série 2", "skill": "Soustraire 9", "time": 180, "items": [["44 − 9 =", 35], ["67 − 9 =", 58], ["32 − 9 =", 23], ["59 − 9 =", 50], ["70 − 9 =", 61], ["148 − 9 =", 139], ["267 − 9 =", 258], ["300 − 9 =", 291], ["652 − 9 =", 643], ["403 − 9 =", 394], ["987 − 9 =", 978], ["359 − 9 =", 350], ["951 − 9 =", 942], ["753 − 9 =", 744], ["258 − 9 =", 249]]}, {"id": "13-3", "title": "Séance 13 • Série 3", "skill": "Soustraire 9", "time": 180, "items": [["83 − 9 =", 74], ["91 − 9 =", 82], ["64 − 9 =", 55], ["48 − 9 =", 39], ["72 − 9 =", 63], ["1000 − 9 =", 991], ["256 − 9 =", 247], ["471 − 9 =", 462], ["395 − 9 =", 386], ["667 − 9 =", 658], ["901 − 9 =", 892], ["476 − 9 =", 467], ["820 − 9 =", 811], ["209 − 9 =", 200], ["777 − 9 =", 768]]}, {"id": "14-2", "title": "Séance 14 • Série 2", "skill": "Soustraire un nombre inférieur à 9", "time": 180, "items": [["30 − 4 =", 26], ["60 − 3 =", 57], ["20 − 7 =", 13], ["50 − 8 =", 42], ["70 − 5 =", 65], ["48 − 6 =", 42], ["67 − 7 =", 60], ["32 − 8 =", 24], ["71 − 3 =", 68], ["43 − 5 =", 38], ["82 − 3 =", 79], ["35 − 7 =", 28], ["91 − 5 =", 86], ["73 − 8 =", 65], ["22 − 4 =", 18]]}, {"id": "14-3", "title": "Séance 14 • Série 3", "skill": "Soustraire un nombre inférieur à 9", "time": 180, "items": [["20 − 6 =", 14], ["40 − 4 =", 36], ["60 − 5 =", 55], ["80 − 3 =", 77], ["50 − 8 =", 42], ["36 − 7 =", 29], ["63 − 6 =", 57], ["31 − 5 =", 26], ["77 − 8 =", 69], ["42 − 3 =", 39], ["83 − 5 =", 78], ["75 − 8 =", 67], ["54 − 6 =", 48], ["72 − 4 =", 68], ["91 − 7 =", 84]]}]; const $=id=>document.getElementById(id); let current=null,remaining=180,timerId=null,finished=false;
function show(which){['menu','game','result'].forEach(id=>$(id).classList.toggle('hidden',id!==which));}
function buildMenu(){$('menuGrid').innerHTML='';SETS.forEach((s,idx)=>{const b=document.createElement('button');b.className='card';b.type='button';b.innerHTML=`<strong>${s.skill}</strong>`;b.addEventListener('click',()=>startSet(idx));$('menuGrid').appendChild(b);});}
function startSet(idx){const oldSummary=document.getElementById('inlineResult');if(oldSummary)oldSummary.remove();$('finishBtn').classList.remove('hidden');$('menuBtn').classList.remove('hidden');current=SETS[idx];remaining=current.time;finished=false;timerStarted=false;clearInterval(timerId);timerId=null;$('gameTitle').textContent=current.title;$('gameSkill').textContent=current.skill;$('calcGrid').innerHTML='';current.items.forEach((it,i)=>{const d=document.createElement('div');d.className='calc';d.dataset.answer=it[1];const hasHole=it[0].includes('□');if(hasHole){const parts=it[0].split('□');d.innerHTML=`<div style="width:100%"><div class="expr">${parts[0]}<input class="ans inlineAns" inputmode="numeric" pattern="[0-9]*" aria-label="Réponse au calcul ${i+1}">${parts[1]}</div><div class="expected">Réponse : ${it[1]}</div></div>`;}else{d.innerHTML=`<div><div class="expr">${it[0]}</div><div class="expected">Réponse : ${it[1]}</div></div><input class="ans" inputmode="numeric" pattern="[0-9]*" aria-label="Réponse au calcul ${i+1}">`;}$('calcGrid').appendChild(d);});$('timer').classList.remove('danger');$('timer').textContent='3:00';$('score').textContent=`Réponses : 0 / ${current.items.length}`;$('progressBar').style.width='0%';show('game');bindInputs();const first=$('calcGrid').querySelector('.ans');if(first)first.focus();}
function bindInputs(){const inputs=[...document.querySelectorAll('.ans')];inputs.forEach((inp,idx)=>{inp.addEventListener('input',()=>{inp.value=inp.value.replace(/[^0-9]/g,'').slice(0,4);updateProgress();});inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(!timerStarted&&inp.value.trim()!==''){timerStarted=true;timerId=setInterval(tick,1000);}const next=inputs[idx+1];if(next)next.focus();else finishSet(false);}});inp.addEventListener('blur',()=>{if(!timerStarted&&inp.value.trim()!==''){timerStarted=true;timerId=setInterval(tick,1000);}});});}
function updateProgress(){const inputs=[...document.querySelectorAll('.ans')];const done=inputs.filter(i=>i.value.trim()!=='').length;$('score').textContent=`Réponses : ${done} / ${inputs.length}`;$('progressBar').style.width=`${Math.round(done/inputs.length*100)}%`;}
function tick(){remaining--;const m=Math.floor(remaining/60),s=remaining%60;$('timer').textContent=`${m}:${String(s).padStart(2,'0')}`;if(remaining<=30)$('timer').classList.add('danger');if(remaining<=0)finishSet(true);}
function finishSet(timeUp){if(finished)return;finished=true;clearInterval(timerId);const cards=[...document.querySelectorAll('.calc')];let good=0;cards.forEach(card=>{const inp=card.querySelector('.ans');inp.disabled=true;const ok=inp.value.trim()!==''&&Number(inp.value)===Number(card.dataset.answer);card.classList.add(ok?'good':'bad');if(ok)good++;});const pct=Math.round(good/current.items.length*100);let summary=document.getElementById('inlineResult');if(!summary){summary=document.createElement('div');summary.id='inlineResult';summary.className='result';summary.style.marginTop='18px';summary.style.borderTop='1px solid var(--line)';summary.style.paddingTop='18px';$('game').appendChild(summary);}summary.innerHTML=`<div style="font-size:1.2rem;font-weight:900;color:var(--navy)">${current.title} — ${current.skill}</div><div class="big">${good} / ${current.items.length}</div><div class="pct">Réussite : ${pct} %</div><div class="note">${timeUp?'Temps écoulé : la correction reste affichée ci-dessus.':(pct>=80?'Très bon travail !':pct>=60?'Encore un petit entraînement et ce sera acquis.':'Rejoue cette série pour progresser.')}</div><div class="actions"><button id="inlineRetryBtn" class="btn primary">↻ Rejouer cette série</button><button id="inlineBackBtn" class="btn secondary">☰ Choisir une autre série</button></div>`;$('finishBtn').classList.add('hidden');$('menuBtn').classList.add('hidden');document.getElementById('inlineRetryBtn').addEventListener('click',()=>startSet(SETS.indexOf(current)));document.getElementById('inlineBackBtn').addEventListener('click',()=>show('menu'));summary.scrollIntoView({behavior:'smooth',block:'start'});}
$('finishBtn').addEventListener('click',()=>finishSet(false));$('menuBtn').addEventListener('click',()=>{clearInterval(timerId);show('menu')});$('backBtn').addEventListener('click',()=>show('menu'));$('retryBtn').addEventListener('click',()=>startSet(SETS.indexOf(current)));buildMenu();
</script></body></html>
